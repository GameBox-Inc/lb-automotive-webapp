---
- name: Hardening LB Automotive Server
  hosts: all
  become: true
  vars:
    ssh_port: 2222
    admin_user: "lb-admin"
    vpn_subnet: "10.0.0.0/8" # Adjust to match your private VPN mesh subnet (e.g., Tailscale, Wireguard)

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install security tools and dependencies
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - apt-listchanges
          - gnupg2
          - curl
          - git
        state: present

    # --- SSH Hardening ---
    - name: Configure SSH Daemon
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: 'sshd -t -f %s'
      loop:
        - { regexp: '^#?Port', line: 'Port {{ ssh_port }}' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?ChallengeResponseAuthentication', line: 'ChallengeResponseAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
      notify: Restart SSH

    # --- Firewall Configuration (UFW) ---
    - name: Set UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH on custom port (VPN Only)
      ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        from_ip: "{{ vpn_subnet }}"
        comment: 'SSH Custom Port (VPN Only)'

    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp
    
    # K3s/Kubernetes might need specific ports if accessing externally, 
    # but typically for a single node we access services via Ingress (80/443).
    # If using VPN mesh, we might need to allow VPN interface specifically.

    - name: Enable UFW
      ufw:
        state: enabled

    # --- IPv6 Disable ---
    - name: Disable IPv6 via sysctl
      sysctl:
        name: "{{ item }}"
        value: '1'
        state: present
        reload: yes
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
        - net.ipv6.conf.lo.disable_ipv6

    # --- Fail2Ban Configuration ---
    - name: Configure Fail2Ban for SSH
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 3600
          findtime = 600
      notify: Restart Fail2Ban

    # --- Automatic Security Updates ---
    - name: Enable Unattended Upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # --- Repo Integrity & GPG Check ---
    - name: Verify Git Repo Integrity
      shell: |
        cd /opt/lb-automotive-dashboard
        git fsck --full
      register: git_fsck_result
      changed_when: false

    - name: Fail if repo is corrupt
      fail:
        msg: "Git repository corruption detected!"
      when: "'dangling' not in git_fsck_result.stdout and git_fsck_result.rc != 0"
    
    # Note: Full GPG verification requires signed commits. 
    # This step assumes we want to verify the repo is clean and HEAD matches origin.
    - name: Verify HEAD matches origin/main
      shell: |
        cd /opt/lb-automotive-dashboard
        git fetch origin
        git diff --quiet HEAD origin/main
      register: git_diff_result
      ignore_errors: yes
      changed_when: false

    - name: Warn if local HEAD differs
      debug:
        msg: "Warning: Local deployment differs from origin/main"
      when: git_diff_result.rc != 0

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted
