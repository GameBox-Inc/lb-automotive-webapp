---
- name: Hardening LB Automotive Server (safe baseline; no lockout)
  hosts: all
  become: true
  vars:
    # Keep SSH on 22 by default. You can switch later once CI uses the new port.
    ssh_port: 22
    vpn_subnet: "10.100.0.0/24"

    # Keep this permissive during bootstrap to avoid the Jenkins->SSH timeout lockout.
    # After you confirm automation works, tighten to vpn_subnet + your home IP.
    ssh_allowed_cidrs:
      - "0.0.0.0/0"

    allow_jenkins_from_vpn: true
    enable_fail2ban: true
    disable_password_auth: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install ufw/fail2ban packages
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - ca-certificates
          - curl
        state: present

    - name: Configure SSH Daemon (keys only)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: "sshd -t -f %s"
      loop:
        - { regexp: '^#?Port\\s', line: 'Port {{ ssh_port }}' }
        - { regexp: '^#?PermitRootLogin\\s', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication\\s', line: 'PasswordAuthentication {{ \"no\" if disable_password_auth else \"yes\" }}' }
        - { regexp: '^#?ChallengeResponseAuthentication\\s', line: 'ChallengeResponseAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication\\s', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?X11Forwarding\\s', line: 'X11Forwarding no' }
      notify: Restart SSH

    - name: UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH (bootstrap-safe)
      ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ssh_allowed_cidrs }}"

    - name: Allow WireGuard
      ufw:
        rule: allow
        port: 51820
        proto: udp

    - name: Allow HTTP/HTTPS to host (tunnel/ingress compatibility)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Allow Jenkins UI only from VPN (8080)
      when: allow_jenkins_from_vpn
      ufw:
        rule: allow
        from_ip: "{{ vpn_subnet }}"
        port: 8080
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Configure Fail2Ban for SSH
      when: enable_fail2ban
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 3600
          findtime = 600
      notify: Restart Fail2Ban

    - name: Configure unattended upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted

