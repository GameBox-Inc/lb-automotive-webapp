apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  url: git@github.com:GameBox-Inc/lb-automotive-webapp.git
  sshPrivateKey: |
    <PRIVATE_KEY_PLACEHOLDER>
  insecure: "false"
  enableLfs: "true"
