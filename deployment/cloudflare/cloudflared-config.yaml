tunnel: TUNNEL_ID_PLACEHOLDER
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Route all traffic to nginx-gateway in gamebox-security namespace
  - hostname: twilio.kozytherocket.space
    service: http://localhost:30880
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      
  # Catch-all rule (required)
  - service: http_status:404
