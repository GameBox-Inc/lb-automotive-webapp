server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security: Restrict public access via Cloudflare
    # If request comes from trycloudflare.com (Host header), block it unless it's the webhook.
    set $block_public_access 0;
    if ($http_host ~* "trycloudflare\.com") {
        set $block_public_access 1;
    }
    
    # Allow Twilio Webhooks strictly
    if ($uri ~* "^/api/twilio/") {
        set $block_public_access 0;
    }

    location / {
        if ($block_public_access) {
            return 403 "Access Denied: Dashboard is strictly VPN-only. Please connect to the private network.";
        }
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy - Forward requests to backend container
    location /api/ {
        # Note: Twilio webhooks are secured via request signature validation in the backend
        # See: python-backend/routes/twilio_webhook.py
        
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
    }
}
