apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lb-automotive
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Image updated by Jenkins CI pipeline
        image: ghcr.io/gamebox-inc/lb-automotive-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "sqlite:////app/data/lb_automotive.db"
        - name: REDIS_URL
        - name: LLM_PROVIDER
          value: "anthropic"  # or "ollama" for local LLM
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: anthropic-secrets
              key: api-key
        - name: ANTHROPIC_MODEL
          value: "claude-3-5-sonnet-20241022"
        volumeMounts:
        - name: app-data
          mountPath: /app/data
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: app-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lb-automotive
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
