apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lb-automotive
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        # Image updated by Jenkins CI pipeline
        image: ghcr.io/gamebox-inc/lb-automotive-backend:16-f2f1a03
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ALLOWED_ORIGINS
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_URL
        - name: LLM_PROVIDER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: LLM_PROVIDER
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: anthropic-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: ANTHROPIC_MODEL
          valueFrom:
            secretKeyRef:
              name: anthropic-secrets
              key: ANTHROPIC_MODEL
              optional: true
        - name: CSP_POLICY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: CSP_POLICY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: twilio-secrets
              key: TWILIO_ACCOUNT_SID
              optional: true
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-secrets
              key: TWILIO_AUTH_TOKEN
              optional: true
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              name: twilio-secrets
              key: TWILIO_PHONE_NUMBER
              optional: true
        volumeMounts:
        - name: app-data
          mountPath: /app/data
        resources:
          limits:
            memory: "384Mi"
            cpu: "400m"
          requests:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: app-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lb-automotive
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
