# Backend deployment — secrets from K8s Secrets (no Vault dependency).
# Create app-secrets, twilio-secrets, anthropic-secrets via:
#   deployment/k8s/create-secrets.sh  (interactive)
#   or Jenkins "Ensure App Secrets" stage (from credentials)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lb-automotive
  labels:
    app: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: backend
          image: ghcr.io/gamebox-inc/lb-automotive-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: app-secrets
            - secretRef:
                name: twilio-secrets
                optional: true
            - secretRef:
                name: anthropic-secrets
                optional: true

          env:
            - name: REDIS_URL
              value: "redis://redis.lb-automotive.svc.cluster.local:6379/0"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          command:
            - uvicorn
            - main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          volumeMounts:
            - name: app-data
              mountPath: /app/data

          resources:
            limits:
              memory: "256Mi"
              cpu: "300m"
            requests:
              memory: "128Mi"
              cpu: "100m"

      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lb-automotive
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
