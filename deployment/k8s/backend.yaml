apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lb-automotive
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Placeholder image - assumes local build or future CI/CD push
        # image: ghcr.io/gamebox-inc/lb-automotive-backend:latest 
        image: lb-automotive-backend:latest
        imagePullPolicy: Never # For local testing if built on node
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "sqlite:////app/data/lb_automotive.db"
        - name: REDIS_URL
        volumeMounts:
        - name: app-data
          mountPath: /app/data
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: app-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lb-automotive
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
