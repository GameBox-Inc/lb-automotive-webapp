apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lb-automotive
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Image updated by Jenkins CI pipeline
        image: ghcr.io/gamebox-inc/lb-automotive-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lb-automotive
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
