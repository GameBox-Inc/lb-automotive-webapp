apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-gateway-policy
  namespace: gamebox-security
spec:
  podSelector:
    matchLabels:
      app: nginx-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from anywhere (Cloudflare IPs enforced at nginx level)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow traffic to lb-automotive namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: lb-automotive
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-security-gateway
  namespace: lb-automotive
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from gamebox-security namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: gamebox-security
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from within lb-automotive namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: lb-automotive
    ports:
    - protocol: TCP
      port: 8000

# ── NOTE: Traefik and Cloudflared do NOT have NetworkPolicies ──────────────────
# Traefik is an ingress controller that needs broad cluster access (K8s API,
# service discovery, EndpointSlice watches). Restricting its egress via
# NetworkPolicy breaks service discovery because K3s kube-proxy DNAT rewrites
# ClusterIPs/ports before policy evaluation, causing ipBlock rules to fail.
#
# Cloudflared similarly needs unrestricted egress to Cloudflare (QUIC/443)
# and to Traefik. Its egress to Traefik also hits the DNAT port mismatch
# (Service port 80 → container port 8000).
#
# Security is enforced at these layers instead:
#   - Cloudflare Tunnel: Only twilio.kozytherocket.space is tunneled
#   - HTTPRoute: Only POST /lb-automotive/api/twilio is routed
#   - Backend: Rate limiting, input validation, Twilio signature verification
