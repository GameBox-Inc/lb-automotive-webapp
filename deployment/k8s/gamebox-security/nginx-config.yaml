apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: gamebox-security
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        # Logging format for honeypot detection
        log_format honeypot_format '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   '"$http_cf_connecting_ip" "$http_cf_ray"';

        # Rate limiting zone
        limit_req_zone $binary_remote_addr zone=twilio:10m rate=10r/s;

        server {
            listen 80;
            server_name _;

            # Cloudflare IP Whitelist - ONLY allow Cloudflare edge IPs
            # This prevents direct access to origin server
            # IPv4 ranges
            allow 173.245.48.0/20;
            allow 103.21.244.0/22;
            allow 103.22.200.0/22;
            allow 103.31.4.0/22;
            allow 141.101.64.0/18;
            allow 108.162.192.0/18;
            allow 190.93.240.0/20;
            allow 188.114.96.0/20;
            allow 197.234.240.0/22;
            allow 198.41.128.0/17;
            allow 162.158.0.0/15;
            allow 104.16.0.0/13;
            allow 104.24.0.0/14;
            allow 172.64.0.0/13;
            allow 131.0.72.0/22;
            
            # IPv6 ranges
            allow 2400:cb00::/32;
            allow 2606:4700::/32;
            allow 2803:f800::/32;
            allow 2405:b500::/32;
            allow 2405:8100::/32;
            allow 2a06:98c0::/29;
            allow 2c0f:f248::/32;
            
            # Block everything else
            deny all;

            # Honeypot - catch all suspicious traffic
            location / {
                access_log /var/log/nginx/honeypot.log honeypot_format;
                return 403 '{"error": "Access Denied", "message": "This endpoint is not publicly accessible"}';
                add_header Content-Type application/json;
            }

            # Health check endpoint
            location /health {
                access_log off;
                return 200 'OK';
            }

            # LB Automotive - Twilio webhook
            location /lb-automotive/api/twilio/ {
                # Validate Cloudflare headers to prevent IP spoofing
                if ($http_cf_connecting_ip = "") {
                    return 403 '{"error": "Direct access not allowed"}';
                }

                # Rate limiting (backup - Cloudflare does primary)
                limit_req zone=twilio burst=10 nodelay;
                
                # Log legitimate traffic
                access_log /var/log/nginx/twilio-webhook.log;
                
                # Proxy to customer namespace
                proxy_pass http://backend.lb-automotive.svc.cluster.local:8000/api/twilio/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $http_cf_connecting_ip;
                proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Timeouts
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
        }
    }
