# =============================================================================
# lb-automotive-routes.yaml — HTTPRoutes for the lb-automotive application
#
# SECURITY POLICY:
#   - twilio.kozytherocket.space accepts ONLY POST to /lb-automotive/api/twilio.
#   - All other requests return Traefik's native 404 (no matching route).
#   - kozytherocket.space (root domain) is NOT routed — Cloudflare Tunnel
#     does not forward it, so it never reaches Traefik.
#   - The frontend and API are NOT exposed publicly.
#     Access is via WireGuard VPN only: http://10.100.0.1:30080/
#
# NOTE: Traefik CRD Middleware ExtensionRefs don't work with Gateway API
#       HTTPRoutes in Traefik v3.6. Using native Gateway API filters instead.
#       Rate limiting is handled by the backend's own rate limiter.
# =============================================================================

# ── Route 1: Twilio Webhook ───────────────────────────────────────────────────
# twilio.kozytherocket.space/api/twilio/* → backend:8000
# POST only — Twilio only ever POSTs to webhooks. Any other method is rejected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-automotive-twilio
  namespace: gamebox-security
spec:
  parentRefs:
    - name: gamebox-gateway
      namespace: gamebox-security
  hostnames:
    - "twilio.kozytherocket.space"
  rules:
    # 1. New path used by relative TwiML redirects (<Gather action="/api/twilio/webhook">)
    - matches:
        - path:
            type: PathPrefix
            value: /api/twilio
          method: POST
      backendRefs:
        - name: backend
          namespace: lb-automotive
          port: 8000

    # 2. Legacy path configured in the Twilio Console (rewritten to backend path)
    - matches:
        - path:
            type: PathPrefix
            value: /lb-automotive/api/twilio
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/twilio
      backendRefs:
        - name: backend
          namespace: lb-automotive
          port: 8000

    # 3. Audio files (IVR thinking sound, etc.) — GET only
    - matches:
        - path:
            type: PathPrefix
            value: /audio
          method: GET
      backendRefs:
        - name: backend
          namespace: lb-automotive
          port: 8000

    # 4. Legacy /lb-automotive/audio for Twilio media fetches
    - matches:
        - path:
            type: PathPrefix
            value: /lb-automotive/audio
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /audio
      backendRefs:
        - name: backend
          namespace: lb-automotive
          port: 8000
