# =============================================================================
# lb-automotive-routes.yaml — HTTPRoutes for the lb-automotive application
#
# SECURITY POLICY:
#   - twilio.kozytherocket.space accepts ONLY POST to /lb-automotive/api/twilio.
#   - All other requests return Traefik's native 404 (no matching route).
#   - kozytherocket.space (root domain) is NOT routed — Cloudflare Tunnel
#     does not forward it, so it never reaches Traefik.
#   - The frontend and API are NOT exposed publicly.
#     Access is via WireGuard VPN only: http://10.100.0.1:30080/
# =============================================================================

# ── Route 1: Twilio Webhook ───────────────────────────────────────────────────
# twilio.kozytherocket.space/lb-automotive/api/twilio/* → backend:8000
# POST only — Twilio only ever POSTs to webhooks. Any other method is rejected.
# Strips /lb-automotive prefix before proxying (backend sees /api/twilio/...)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-automotive-twilio
  namespace: gamebox-security
spec:
  parentRefs:
    - name: gamebox-gateway
      namespace: gamebox-security
  hostnames:
    - "twilio.kozytherocket.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /lb-automotive/api/twilio
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit-twilio
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-lb-automotive-prefix
      backendRefs:
        - name: backend
          namespace: lb-automotive
          port: 8000
