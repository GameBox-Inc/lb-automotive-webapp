# =============================================================================
# vault-helm-values.yaml — HashiCorp Vault Helm Chart Values
# GameBox OS Platform — gamebox-security namespace
#
# Install:
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm repo update
#   helm install vault hashicorp/vault \
#     --namespace gamebox-security \
#     --create-namespace \
#     --values vault-helm-values.yaml
# =============================================================================

global:
  # All components use TLS — no plaintext Vault traffic
  tlsDisable: false

# ── Vault Server ──────────────────────────────────────────────────────────────
server:
  # Single-node standalone. For HA upgrade to raft backend when cluster grows.
  standalone:
    enabled: true
    config: |
      ui = false

      listener "tcp" {
        tls_disable     = 0
        address         = "[::]:8200"
        cluster_address = "[::]:8201"

        # TLS cert from the secret created by vault-tls-secret.sh
        tls_cert_file = "/vault/userconfig/vault-server-tls/vault.crt"
        tls_key_file  = "/vault/userconfig/vault-server-tls/vault.key"
        tls_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"

        # Require mutual TLS for cluster traffic only; agent uses standard TLS
        tls_min_version = "tls13"
      }

      storage "file" {
        path = "/vault/data"
      }

      # Telemetry for future Prometheus integration
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }

  # Mount the TLS secret into the pod
  volumes:
    - name: vault-server-tls
      secret:
        secretName: vault-server-tls

  volumeMounts:
    - name: vault-server-tls
      mountPath: /vault/userconfig/vault-server-tls
      readOnly: true

  # Use the vault ServiceAccount (has TokenReview RBAC)
  serviceAccount:
    create: false
    name: vault

  # Persistent storage for Vault data
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: null  # Use cluster default

  # Security context — run as non-root
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Readiness probe uses HTTPS
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    scheme: HTTPS

  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    scheme: HTTPS

  # Expose Vault on port 8200 within the cluster
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

# ── Vault Agent Injector ──────────────────────────────────────────────────────
injector:
  enabled: true

  # The injector talks to Vault over TLS
  externalVaultAddr: ""  # Empty = use in-cluster Vault service

  # Vault address the agent sidecar uses
  # Must match the TLS SAN
  agentImage:
    repository: "hashicorp/vault"
    tag: "1.15.6"

  # TLS settings for the injector's MutatingWebhookConfiguration
  # caBundle is auto-injected by cert-manager or set manually
  # Since we're using our own CA, we set it in the webhook object directly
  certs:
    secretName: vault-server-tls
    certName: vault.crt
    keyName: vault.key

  webhook:
    # Only inject into namespaces with the label: vault-injection=enabled
    namespaceSelector:
      matchLabels:
        vault-injection: "enabled"

    # Fail open — don't block pod admission if injector is unavailable
    failurePolicy: Ignore

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    capabilities:
      drop:
        - ALL

# ── UI — disabled in production ───────────────────────────────────────────────
ui:
  enabled: false  # No public UI. Use kubectl port-forward for admin access.
