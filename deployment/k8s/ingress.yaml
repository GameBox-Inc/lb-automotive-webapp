apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kozy-app-store-ingress
  namespace: lb-automotive
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - kozytherocket.space
    - www.kozytherocket.space
    secretName: kozytherocket-tls
  rules:
  - host: kozytherocket.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
  - host: www.kozytherocket.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
