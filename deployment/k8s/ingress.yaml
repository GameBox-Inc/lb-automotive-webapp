apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lb-automotive-ingress
  namespace: lb-automotive
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
