apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lb-automotive
  labels:
    app: redis
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # Optimized for low-memory server (2GB total).
          # IVR uses call-scoped keys + TTL; under burst load watch: redis-cli INFO memory,
          # evicted_keys. If LLM result keys disappear early, raise --maxmemory / limits together.
          # Tune IVR_LLM_CONCURRENCY_LIMIT on the backend to reduce Anthropic + Redis pressure.
          command:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
            - --loglevel
            - warning
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
            requests:
              memory: "128Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lb-automotive
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
