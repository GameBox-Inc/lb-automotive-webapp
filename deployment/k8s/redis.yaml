apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lb-automotive
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        # Optimized for low-memory server (2GB total)
        command:
          - redis-server
          - --maxmemory
          - 64mb
          - --maxmemory-policy
          - allkeys-lru
          - --save
          - ""
          - --appendonly
          - "no"
          - --loglevel
          - warning
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lb-automotive
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
