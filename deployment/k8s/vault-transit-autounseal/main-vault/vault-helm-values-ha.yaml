# =============================================================================
# vault-helm-values-ha.yaml — Main Vault (gamebox-security namespace) HA config
#
# Replaces vault-helm-values.yaml for the Main Vault after adding transit seal.
# Changes from standalone:
#   - HA mode with Raft storage (replicas: 1 on single node)
#   - seal "transit" pointing to Unseal Vault in vault-unseal namespace
#   - Token sourced from K8s Secret vault-transit-token (env var injection)
#   - CA cert for Unseal Vault TLS mounted from unseal-vault-ca secret
#
# Apply with:
#   helm upgrade vault hashicorp/vault \
#     --namespace gamebox-security \
#     --values vault-helm-values-ha.yaml
# =============================================================================

global:
  tlsDisable: false

server:
  # ── HA mode with Raft (single node — increase replicas when cluster grows) ──
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = 0
          tls_cert_file = "/vault/userconfig/vault-server-tls/vault.crt"
          tls_key_file  = "/vault/userconfig/vault-server-tls/vault.key"
          tls_ca_cert_file = "/vault/userconfig/vault-server-tls/ca.crt"
          tls_min_version = "tls13"
        }

        storage "raft" {
          path    = "/vault/data"
          node_id = "${HOSTNAME}"
        }

        # ── Transit Auto-Unseal ───────────────────────────────────────────────
        # Token is injected via VAULT_TRANSIT_TOKEN env var from K8s Secret.
        # CA cert for Unseal Vault TLS is mounted from unseal-vault-ca secret.
        seal "transit" {
          address         = "https://unseal-vault.vault-unseal.svc.cluster.local:8200"
          token           = "${VAULT_TRANSIT_TOKEN}"
          key_name        = "autounseal"
          mount_path      = "transit/"
          tls_ca_cert     = "/vault/userconfig/unseal-vault-ca/ca.crt"
          tls_skip_verify = false
        }

        api_addr     = "https://vault.gamebox-security.svc.cluster.local:8200"
        cluster_addr = "https://${HOSTNAME}.vault-internal.gamebox-security.svc.cluster.local:8201"

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

  # ── Inject transit token from K8s Secret ─────────────────────────────────
  extraEnv:
    - name: VAULT_TRANSIT_TOKEN
      valueFrom:
        secretKeyRef:
          name: vault-transit-token
          key: token

  volumes:
    - name: vault-server-tls
      secret:
        secretName: vault-server-tls
    # CA cert for verifying Unseal Vault TLS
    - name: unseal-vault-ca
      secret:
        secretName: unseal-vault-ca

  volumeMounts:
    - name: vault-server-tls
      mountPath: /vault/userconfig/vault-server-tls
      readOnly: true
    - name: unseal-vault-ca
      mountPath: /vault/userconfig/unseal-vault-ca
      readOnly: true

  serviceAccount:
    create: false
    name: vault

  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: null

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    scheme: HTTPS

  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204"
    scheme: HTTPS

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

# ── Vault Agent Injector ────────────────────────────────────────────────────
injector:
  enabled: true
  externalVaultAddr: ""
  agentImage:
    repository: "hashicorp/vault"
    tag: "1.15.6"
  webhook:
    namespaceSelector:
      matchLabels:
        vault-injection: "enabled"
    failurePolicy: Ignore
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    capabilities:
      drop:
        - ALL

ui:
  enabled: false
