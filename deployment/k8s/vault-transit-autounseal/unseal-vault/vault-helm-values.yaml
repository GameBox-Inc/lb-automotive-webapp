# =============================================================================
# vault-helm-values.yaml — Unseal Vault (vault-unseal namespace)
#
# Standalone Vault CE instance. Its ONLY purpose:
#   - Host the Transit secrets engine
#   - Hold the auto-unseal key for Main Vault
#   - Issue a long-lived, least-privilege token for Main Vault's seal config
#
# This Vault is NOT used for application secrets.
# DO NOT inject this Vault's secrets into application pods.
# =============================================================================

global:
  tlsDisable: false

server:
  standalone:
    enabled: true
    config: |
      ui = false

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 0

        # Certs generated by tls/generate-tls.sh
        tls_cert_file = "/vault/userconfig/unseal-vault-tls/vault.crt"
        tls_key_file  = "/vault/userconfig/unseal-vault-tls/vault.key"
        tls_ca_cert_file = "/vault/userconfig/unseal-vault-tls/ca.crt"
        tls_min_version = "tls13"
      }

      # Raft storage — no Consul required
      storage "raft" {
        path    = "/vault/data"
        node_id = "unseal-vault-0"
      }

      api_addr     = "https://unseal-vault.vault-unseal.svc.cluster.local:8200"
      cluster_addr = "https://unseal-vault.vault-unseal.svc.cluster.local:8201"

      # Audit log — required when handling any secrets
      # Output: stdout → captured by K8s logging
      # Rotate via log aggregation (Loki, CloudWatch, etc.)

  volumes:
    - name: unseal-vault-tls
      secret:
        secretName: unseal-vault-tls

  volumeMounts:
    - name: unseal-vault-tls
      mountPath: /vault/userconfig/unseal-vault-tls
      readOnly: true

  serviceAccount:
    create: true
    name: unseal-vault

  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: null   # Uses cluster default

  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    scheme: HTTPS

  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204"
    scheme: HTTPS

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

# No injector on Unseal Vault — it serves no application secrets
injector:
  enabled: false

ui:
  enabled: false
