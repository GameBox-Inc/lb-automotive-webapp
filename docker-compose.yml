version: '3.8'

services:
  # Python Backend Service
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: lb-automotive-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/lb_automotive.db}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - ./python-backend/data:/app/data
      - ./python-backend:/app
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - lb-automotive-network

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: lb-automotive-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - lb-automotive-network

  lb-automotive-frontend:
    build:
      context: ./project-bolt-bolt-vite-react-bpj7xxwp/project
      dockerfile: Dockerfile
    container_name: lb-automotive-frontend
    restart: unless-stopped
    volumes:
      - ./project-bolt-bolt-vite-react-bpj7xxwp/project:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://electrolytically-deprived-eldon.ngrok-free.dev/api
    networks:
      - lb-automotive-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--domain=electrolytically-deprived-eldon.ngrok-free.dev"
      - "traefik:80"
      - "--log=stdout"
    ports:
      - "4040:4040"  # ngrok web interface
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    networks:
      - lb-automotive-network
    depends_on:
      - python-backend
    labels:
      - lb-automotive-network

  redis:
    image: redis:7-alpine
    container_name: lb-automotive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - lb-automotive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: lb-automotive-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - lb-automotive-network
    depends_on:
      - python-backend

networks:
  lb-automotive-network:
    driver: bridge

volumes:
  traefik-certs:
  db-data:
  redis-data:
  prometheus-data:
