http:
  routers:
    api:
      rule: "PathPrefix(`/api`)"
      service: api-service
      entryPoints:
        - web
    
    frontend:
      rule: "PathPrefix(`/`)"
      service: frontend-service
      entryPoints:
        - web

  services:
    api-service:
      loadBalancer:
        servers:
          - url: "http://python-backend:8000"
    
    frontend-service:
      loadBalancer:
        servers:
          - url: "http://lb-automotive-frontend:5173"
