# Traefik Static Configuration
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
# #   docker:
#     endpoint: "unix:///var/run/docker.sock"
#     exposedByDefault: false
#     network: lb-automotive-network
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG
  format: common

accessLog:
  format: common
